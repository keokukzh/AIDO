[package]
name = "aido-core"
version = "0.1.0"
description = "AIDO Core — Local AI Desktop Assistant Backend, Permission Gateway, Windows Bridge & SQLite/FTS5 Memory"
authors = ["keokukzh"]
edition = "2021"

[lib]
name = "aido_core"
path = "src/lib.rs"

[[bin]]
name = "aido-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
ureq = { version = "2.10", features = ["json"] }
thiserror = "2.0"

[package]
name = "aido-core"
version = "0.1.0"
description = "AIDO Core — Local AI Desktop Assistant Backend, Permission Gateway, Windows Bridge & SQLite/FTS5 Memory"
authors = ["keokukzh"]
edition = "2021"
default-run = "AIDO"

[lib]
name = "aido_core"
path = "src/lib.rs"

[[bin]]
name = "aido-cli"
path = "src/main.rs"

[[bin]]
name = "AIDO"
path = "src/desktop/main.rs"
required-features = ["desktop"]

[features]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-dialog", "dep:windows-sys"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
ureq = { version = "2.10", features = ["json"] }
url = "=2.5.8"
thiserror = "2.0"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_StationsAndDesktops"], optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIDO — Infinite Brand Transformation</title>
  <link rel="icon" type="image/png" href="./assets/AIDO-MONO-Charakter.png" />
  <style>
    body { margin: 0; }

    .aido-stage {
      --aido-duration: 10.4s;
      --aido-word-scale-x: .215;
      --aido-word-scale-y: .29;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: #fff;
      color: #000;
    }

    .aido-transform {
      display: block;
      width: min(100%, 960px, 223svh);
      height: auto;
      fill: currentColor;
    }

    .aido-word {
      --aido-word-y: -14.5px;
      --aido-word-origin: translate(var(--aido-word-x), var(--aido-word-y));
    }

    .aido-word-a {
      --aido-word-x: -346.7px;
      --aido-mark: translate(-174px, -50px) rotate(0deg) scale(1);
      --aido-mono: translate(-54.5px, 15px) rotate(0deg) scale(1, .54);
    }

    .aido-word-i {
      --aido-word-x: -189.8px;
      --aido-mark: translate(-61px, -50px) rotate(0deg) scale(1);
      --aido-mono: translate(-6.6px, -19px) rotate(0deg) scale(.55, .27);
    }

    .aido-word-d {
      --aido-word-x: 19.5px;
      --aido-mark: translate(-24px, -50px) rotate(0deg) scale(1);
      --aido-mono: translate(-43px, 30px) rotate(-90deg) scale(.78, .86);
    }

    .aido-word-o {
      --aido-word-x: 173.5px;
      --aido-mark: translate(74px, -50px) rotate(0deg) scale(1);
      --aido-mono: translate(-31px, -105px) rotate(0deg) scale(.62);
    }

    .aido-letter {
      --aido-start: var(--aido-word-origin) rotate(0deg)
        scale(calc(var(--aido-word-scale-x) * 1.08), var(--aido-word-scale-y));
      transform: var(--aido-start);
      transform-origin: 0 0;
      animation: aido-letter var(--aido-duration) cubic-bezier(.55, 0, .25, 1) infinite both;
    }

    .aido-letter-o {
      animation-name: aido-letter, aido-head-arc;
    }

    .aido-tail-origin {
      transform: var(--aido-word-origin) scale(var(--aido-word-scale-x), var(--aido-word-scale-y));
    }

    .aido-tail {
      transform-box: fill-box;
      transform-origin: left center;
      animation: aido-tail var(--aido-duration) ease-in-out infinite both;
    }

    .aido-outline-morph {
      animation: aido-outline var(--aido-duration) cubic-bezier(.55, 0, .25, 1) infinite both;
    }

    @keyframes aido-letter {
      0%, 20%, 96%, 100% { transform: var(--aido-start); }
      32%, 45% { transform: var(--aido-mark); }
      61%, 76% { transform: var(--aido-mono); }
    }

    @keyframes aido-head-arc {
      0%, 45%, 61%, 100% { translate: 0 0; }
      52% { translate: 0 -34px; }
    }

    @keyframes aido-tail {
      0%, 13%, 97%, 100% { transform: translateX(0) scale(1); }
      25%, 90% { transform: translateX(-24px) scale(0); }
    }

    @keyframes aido-outline {
      0%, 45%, 96%, 100% { d: var(--aido-outline-start); }
      61%, 76% { d: var(--aido-outline-mono); }
    }

    @media (max-width: 580px) {
      .aido-stage { --aido-word-scale-x: .35; --aido-word-scale-y: .49; }
      .aido-word-a { --aido-word-x: -289.5px; --aido-word-y: -68px; }
      .aido-word-i { --aido-word-x: -34.2px; --aido-word-y: -68px; }
      .aido-word-d { --aido-word-x: -266.2px; --aido-word-y: 19px; }
      .aido-word-o { --aido-word-x: -15.5px; --aido-word-y: 19px; }
    }
  </style>
</head>
